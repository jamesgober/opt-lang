# =============================================================================
#  R E P S   ·   opt-lang
# =============================================================================
[package]
name    = "opt-lang"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "SSA optimization passes for ir-lang: sparse conditional constant propagation, value numbering, dead-code elimination, CFG simplification, copy propagation, and loop-invariant code motion."

# Keywords (5 max)
keywords = ["optimizer", "ssa", "compiler", "ir", "lexersketch"]

# Categories
categories = ["compilers", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/opt-lang"
repository    = "https://github.com/jamesgober/opt-lang"
documentation = "https://docs.rs/opt-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "opt_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = ["ir-lang/std", "pass-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The IR this crate rewrites. Pinned exactly: 2.0.0-alpha.1 is a pre-release.
ir-lang   = { version = "=2.0.0-alpha.1", default-features = false }
# The pipeline scheduler (fixpoint loop and per-pass report).
pass-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# The reference interpreter is the oracle for the differential tests and for the
# constant folder (`eval_*`).
ir-lang   = { version = "=2.0.0-alpha.1", features = ["interp"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
